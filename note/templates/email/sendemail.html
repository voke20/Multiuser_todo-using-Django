<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background:#f5f6fa; font-family:Arial;">

    <div style="max-width:600px; margin:40px auto; background:#fff; padding:20px; border-radius:10px;">

      <!-- Header -->
      <h2 style="color:#6b3fa0;">NoteApp</h2>
      <p style="color:#666;">A note has been shared with you</p>

      <hr style="border:none; border-top:1px solid #eee;" />

      <!-- Title -->
      <h3 style="color:#222;">
        {{ title }}
      </h3>

      <!-- Content -->
      <p style="color:#444; line-height:1.6; white-space:pre-line;">
        {{ content }}
      </p>

      <!-- Button -->
      <a href="{{ link }}"
         style="display:inline-block; margin-top:20px; padding:10px 16px;
                background:#6b3fa0; color:#fff; text-decoration:none;
                border-radius:6px;">
          Create Account
      </a>

      <p style="color: #666;"> {{sender}} shared a note with you. </p>

      <!-- Footer -->
      <p style="margin-top:30px; font-size:12px; color:#999;">
        Sent via NoteApp
      </p>

    </div>

  </body>
</html>
